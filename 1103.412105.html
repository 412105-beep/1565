<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>前端課程學習歷程與作業展示</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @media print {
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            body { background: white !important; color: black !important; }
            .shadow-lg, .shadow-md, .shadow-sm { box-shadow: none !important; }
            .border { border-color: #ddd !important; }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col font-sans">

    <!-- Header / Navbar -->
    <header class="bg-indigo-700 text-white shadow-md no-print sticky top-0 z-30">
        <div class="max-w-6xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-code text-2xl text-indigo-200"></i>
                <h1 class="text-xl font-bold tracking-wide">前端開發課程｜學習歷程與作業展示</h1>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="openModal()" class="bg-emerald-500 hover:bg-emerald-600 text-white px-3 py-2 rounded-lg text-sm font-medium transition flex items-center gap-1 shadow">
                    <i class="fa-solid fa-plus"></i> 新增作業紀錄
                </button>
                <button onclick="window.print()" class="bg-indigo-600 hover:bg-indigo-800 text-white px-3 py-2 rounded-lg text-sm font-medium transition flex items-center gap-1 border border-indigo-400">
                    <i class="fa-solid fa-print"></i> 列印 / 匯出 PDF
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-6xl mx-auto px-4 py-8 flex-grow w-full space-y-8">

        <!-- Student Profile Card -->
        <section class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 flex flex-col md:flex-row gap-6 items-center md:items-start">
            <div class="relative">
                <img id="avatarImg" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=250&q=80" alt="Student Profile" class="w-28 h-28 rounded-full object-cover border-4 border-indigo-100 shadow">
            </div>
            <div class="flex-grow text-center md:text-left space-y-2">
                <div class="flex flex-col md:flex-row md:items-center justify-between gap-2">
                    <div>
                        <h2 class="text-2xl font-bold text-slate-900" id="studentName">陳小明</h2>
                        <p class="text-indigo-600 font-medium text-sm" id="studentDetail">資訊工程學系 ｜ 學號：B11015000</p>
                    </div>
                    <span class="inline-flex items-center justify-center bg-indigo-50 text-indigo-700 border border-indigo-200 px-3 py-1 rounded-full text-xs font-semibold self-center md:self-start">
                        2026 前端網頁開發課程
                    </span>
                </div>
                <p class="text-slate-600 text-sm max-w-2xl" id="studentBio">
                    熱愛 Web 前端開發技術，專注於 HTML5、CSS3、JavaScript ES6+ 與響應式網頁設計 (RWD)。此檔案記錄了本學期所有前端實作作業與開發心得。
                </p>
                <div class="pt-2 flex flex-wrap justify-center md:justify-start gap-2">
                    <span class="bg-slate-100 text-slate-700 text-xs px-2.5 py-1 rounded font-mono">HTML5</span>
                    <span class="bg-slate-100 text-slate-700 text-xs px-2.5 py-1 rounded font-mono">CSS3 / Tailwind</span>
                    <span class="bg-slate-100 text-slate-700 text-xs px-2.5 py-1 rounded font-mono">JavaScript (ES6+)</span>
                    <span class="bg-slate-100 text-slate-700 text-xs px-2.5 py-1 rounded font-mono">RWD 響應式</span>
                    <span class="bg-slate-100 text-slate-700 text-xs px-2.5 py-1 rounded font-mono">Git / GitHub</span>
                </div>
            </div>
        </section>

        <!-- Control Bar: Search & Filter -->
        <section class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 no-print flex flex-col md:flex-row justify-between items-center gap-4">
            <!-- Search -->
            <div class="relative w-full md:w-72">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                <input type="text" id="searchInput" oninput="renderAssignments()" placeholder="搜尋作業名稱或標籤..." class="w-full pl-9 pr-4 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <!-- Category Filter -->
            <div class="flex items-center gap-2 w-full md:w-auto overflow-x-auto pb-1 md:pb-0" id="categoryFilters">
                <button onclick="setCategory('All')" class="cat-btn active bg-indigo-600 text-white px-3 py-1.5 rounded-lg text-xs font-medium whitespace-nowrap transition">全部作業</button>
                <button onclick="setCategory('HTML/CSS')" class="cat-btn bg-slate-100 text-slate-600 hover:bg-slate-200 px-3 py-1.5 rounded-lg text-xs font-medium whitespace-nowrap transition">HTML / CSS</button>
                <button onclick="setCategory('JavaScript')" class="cat-btn bg-slate-100 text-slate-600 hover:bg-slate-200 px-3 py-1.5 rounded-lg text-xs font-medium whitespace-nowrap transition">JavaScript 應用</button>
                <button onclick="setCategory('RWD')" class="cat-btn bg-slate-100 text-slate-600 hover:bg-slate-200 px-3 py-1.5 rounded-lg text-xs font-medium whitespace-nowrap transition">RWD 響應式</button>
                <button onclick="setCategory('Final Project')" class="cat-btn bg-slate-100 text-slate-600 hover:bg-slate-200 px-3 py-1.5 rounded-lg text-xs font-medium whitespace-nowrap transition">期末專題</button>
            </div>
        </section>

        <!-- Assignments Grid -->
        <section class="space-y-4">
            <div class="flex justify-between items-center">
                <h3 class="text-lg font-bold text-slate-800 border-l-4 border-indigo-600 pl-3">作業與實作成果列表</h3>
                <span id="assignmentCount" class="text-xs text-slate-500">共 0 份作業</span>
            </div>

            <div id="assignmentGrid" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Dynamic Card Content will be rendered here -->
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-6 text-center text-xs text-slate-500 no-print mt-auto">
        <p>© 2026 前端課程學習歷程檔案系統 ｜ 本網頁支援資料本地自動儲存 (LocalStorage)</p>
    </footer>

    <!-- Add/Edit Assignment Modal -->
    <div id="assignmentModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4 no-print">
        <div class="bg-white rounded-xl shadow-2xl border border-slate-200 w-full max-w-lg overflow-hidden flex flex-col max-h-[90vh]">
            <div class="px-6 py-4 bg-slate-50 border-b border-slate-200 flex justify-between items-center">
                <h3 class="font-bold text-slate-800" id="modalTitle">新增作業紀錄</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            
            <form id="assignmentForm" onsubmit="saveAssignment(event)" class="p-6 space-y-4 overflow-y-auto flex-grow">
                <input type="hidden" id="assignmentId">

                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">作業名稱 *</label>
                    <input type="text" id="title" required placeholder="例如：作業三 - 個人履歷表網頁" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">作業分類</label>
                        <select id="category" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                            <option value="HTML/CSS">HTML / CSS</option>
                            <option value="JavaScript">JavaScript 應用</option>
                            <option value="RWD">RWD 響應式</option>
                            <option value="Final Project">期末專題</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">完成日期</label>
                        <input type="date" id="date" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">成果圖片網址 (URL)</label>
                    <input type="url" id="imageUrl" placeholder="https://..." class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">Demo 預覽連結</label>
                        <input type="url" id="demoUrl" placeholder="https://..." class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">GitHub 程式碼連結</label>
                        <input type="url" id="githubUrl" placeholder="https://github.com/..." class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">技術標籤 (用逗號分隔)</label>
                    <input type="text" id="tags" placeholder="Flexbox, Grid, DOM, API" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">作業簡介與目標</label>
                    <textarea id="description" rows="2" placeholder="簡述本次作業的需求與實現功能..." class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none"></textarea>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">學習心得與克服問題</label>
                    <textarea id="reflection" rows="3" placeholder="在這次作業中學到了什麼？遇到了什麼 Bug，又是如何解決的？" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none"></textarea>
                </div>

                <div class="pt-4 border-t border-slate-200 flex justify-end gap-3">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 border border-slate-300 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-50">取消</button>
                    <button type="submit" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-sm font-medium shadow">儲存紀錄</button>
                </div>
            </form>
        </div>
    </div>

    <!-- JavaScript Application Logic -->
    <script>
        // Preset sample data
        const initialAssignments = [
            {
                id: '1',
                title: '作業一：個人品牌靜態履歷網頁',
                category: 'HTML/CSS',
                date: '2026-09-20',
                imageUrl: 'https://images.unsplash.com/photo-1507238691740-187a5b1d37b8?auto=format&fit=crop&w=600&q=80',
                demoUrl: 'https://example.com/demo1',
                githubUrl: 'https://github.com/example/hw1',
                tags: ['HTML5', 'CSS Semantic', 'Flexbox'],
                description: '運用 HTML 語意化標籤建立個人履歷結構，並使用 CSS Flexbox 完成切頁與排版設計。',
                reflection: '第一次掌握了 Flexbox 的 justify-content 與 align-items 屬性，成功解決了元素居中的難題，對網頁佈局有了更直觀的理解。'
            },
            {
                id: '2',
                title: '作業二：互動式待辦事項清單 (To-Do List)',
                category: 'JavaScript',
                date: '2026-10-15',
                imageUrl: 'https://images.unsplash.com/photo-1484480974693-6ca0a78fb36b?auto=format&fit=crop&w=600&q=80',
                demoUrl: 'https://example.com/demo2',
                githubUrl: 'https://github.com/example/todo-app',
                tags: ['JavaScript', 'DOM 操作', 'LocalStorage'],
                description: '使用原生 JS 打造待辦清單，支援新增、切換完成狀態、刪除以及資料儲存於 LocalStorage。',
                reflection: '深入了解了 DOM 操作與事件監聽 (Event Delegation)，並學習如何運用 LocalStorage 讓使用者重新整理頁面後資料不會丟失。'
            }
        ];

        // App State
        let assignments = JSON.parse(localStorage.getItem('fe_assignments')) || initialAssignments;
        let currentCategory = 'All';

        // Save to LocalStorage
        function saveToStorage() {
            localStorage.setItem('fe_assignments', JSON.stringify(assignments));
        }

        // Category Filter Setup
        function setCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                if (btn.innerText.includes(cat) || (cat === 'All' && btn.innerText.includes('全部'))) {
                    btn.className = 'cat-btn active bg-indigo-600 text-white px-3 py-1.5 rounded-lg text-xs font-medium whitespace-nowrap transition';
                } else {
                    btn.className = 'cat-btn bg-slate-100 text-slate-600 hover:bg-slate-200 px-3 py-1.5 rounded-lg text-xs font-medium whitespace-nowrap transition';
                }
            });
            renderAssignments();
        }

        // Render Assignment Cards
        function renderAssignments() {
            const grid = document.getElementById('assignmentGrid');
            const searchKeyword = document.getElementById('searchInput').value.toLowerCase();

            const filtered = assignments.filter(item => {
                const matchesCat = currentCategory === 'All' || item.category === currentCategory;
                const matchesSearch = item.title.toLowerCase().includes(searchKeyword) ||
                                      item.tags.some(t => t.toLowerCase().includes(searchKeyword));
                return matchesCat && matchesSearch;
            });

            document.getElementById('assignmentCount').innerText = `共 ${filtered.length} 份作業`;

            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full bg-white rounded-xl border border-dashed border-slate-300 p-12 text-center text-slate-400">
                        <i class="fa-solid fa-folder-open text-4xl mb-2"></i>
                        <p>尚無符合條件的作業紀錄</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = filtered.map(item => `
                <div class="bg-white rounded-xl border border-slate-200 shadow-sm hover:shadow-md transition overflow-hidden flex flex-col">
                    <div class="relative h-48 bg-slate-100 overflow-hidden">
                        <img src="${item.imageUrl || 'https://images.unsplash.com/photo-1517694712202-14dd9538aa97?auto=format&fit=crop&w=600&q=80'}" 
                             alt="${item.title}" class="w-full h-full object-cover">
                        <span class="absolute top-3 left-3 bg-slate-900/70 backdrop-blur-md text-white text-xs px-2.5 py-1 rounded-full font-medium">
                            ${item.category}
                        </span>
                        <div class="absolute top-3 right-3 flex gap-1 no-print">
                            <button onclick="editAssignment('${item.id}')" class="bg-white/90 hover:bg-white text-slate-700 w-8 h-8 rounded-full shadow flex items-center justify-center text-xs transition">
                                <i class="fa-solid fa-pen"></i>
                            </button>
                            <button onclick="deleteAssignment('${item.id}')" class="bg-white/90 hover:bg-red-50 text-red-600 w-8 h-8 rounded-full shadow flex items-center justify-center text-xs transition">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </div>
                    </div>

                    <div class="p-5 flex-grow flex flex-col space-y-3">
                        <div class="flex justify-between items-start gap-2">
                            <h4 class="font-bold text-slate-900 text-lg leading-snug">${item.title}</h4>
                            <span class="text-xs text-slate-400 font-mono whitespace-nowrap">${item.date}</span>
                        </div>

                        <p class="text-xs text-slate-600 line-clamp-2">${item.description || '無描述資訊'}</p>

                        ${item.reflection ? `
                            <div class="bg-indigo-50/60 border-l-2 border-indigo-500 p-3 rounded-r-lg text-xs text-slate-700 space-y-1">
                                <span class="font-semibold text-indigo-900 block"><i class="fa-solid fa-lightbulb text-indigo-500 mr-1"></i>學習心得與反思：</span>
                                <p class="italic leading-relaxed">${item.reflection}</p>
                            </div>
                        ` : ''}

                        <div class="pt-2 flex flex-wrap gap-1.5 mt-auto">
                            ${item.tags.map(tag => `<span class="bg-slate-100 text-slate-600 text-[10px] px-2 py-0.5 rounded">${tag.trim()}</span>`).join('')}
                        </div>
                    </div>

                    <div class="px-5 py-3 bg-slate-50 border-t border-slate-100 flex justify-between items-center text-xs no-print">
                        <div class="flex gap-3">
                            ${item.demoUrl ? `<a href="${item.demoUrl}" target="_blank" class="text-indigo-600 hover:text-indigo-800 font-medium flex items-center gap-1"><i class="fa-solid fa-arrow-up-right-from-square"></i> Demo 展示</a>` : ''}
                            ${item.githubUrl ? `<a href="${item.githubUrl}" target="_blank" class="text-slate-600 hover:text-slate-900 font-medium flex items-center gap-1"><i class="fa-brands fa-github"></i> GitHub</a>` : ''}
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Modal Control Functions
        function openModal(editId = null) {
            const modal = document.getElementById('assignmentModal');
            const form = document.getElementById('assignmentForm');
            form.reset();

            if (editId) {
                const item = assignments.find(a => a.id === editId);
                if (item) {
                    document.getElementById('modalTitle').innerText = '編輯作業紀錄';
                    document.getElementById('assignmentId').value = item.id;
                    document.getElementById('title').value = item.title;
                    document.getElementById('category').value = item.category;
                    document.getElementById('date').value = item.date;
                    document.getElementById('imageUrl').value = item.imageUrl || '';
                    document.getElementById('demoUrl').value = item.demoUrl || '';
                    document.getElementById('githubUrl').value = item.githubUrl || '';
                    document.getElementById('tags').value = item.tags.join(', ');
                    document.getElementById('description').value = item.description || '';
                    document.getElementById('reflection').value = item.reflection || '';
                }
            } else {
                document.getElementById('modalTitle').innerText = '新增作業紀錄';
                document.getElementById('assignmentId').value = '';
                document.getElementById('date').value = new Date().toISOString().split('T')[0];
            }

            modal.classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('assignmentModal').classList.add('hidden');
        }

        function editAssignment(id) {
            openModal(id);
        }

        function deleteAssignment(id) {
            if (confirm('確定要刪除這筆作業紀錄嗎？')) {
                assignments = assignments.filter(a => a.id !== id);
                saveToStorage();
                renderAssignments();
            }
        }

        function saveAssignment(event) {
            event.preventDefault();
            const id = document.getElementById('assignmentId').value;
            const title = document.getElementById('title').value;
            const category = document.getElementById('category').value;
            const date = document.getElementById('date').value;
            const imageUrl = document.getElementById('imageUrl').value;
            const demoUrl = document.getElementById('demoUrl').value;
            const githubUrl = document.getElementById('githubUrl').value;
            const tags = document.getElementById('tags').value.split(',').map(t => t.trim()).filter(Boolean);
            const description = document.getElementById('description').value;
            const reflection = document.getElementById('reflection').value;

            if (id) {
                // Update
                const index = assignments.findIndex(a => a.id === id);
                if (index !== -1) {
                    assignments[index] = { id, title, category, date, imageUrl, demoUrl, githubUrl, tags, description, reflection };
                }
            } else {
                // Create
                const newAssignment = {
                    id: Date.now().toString(),
                    title, category, date, imageUrl, demoUrl, githubUrl, tags, description, reflection
                };
                assignments.unshift(newAssignment);
            }

            saveToStorage();
            renderAssignments();
            closeModal();
        }

        // Initialize App
        renderAssignments();
    </script>
</body>
</html>
